services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: servicecheck
      POSTGRES_USER: servicecheck
      POSTGRES_PASSWORD: ${DB_PASSWORD:-servicecheck}
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U servicecheck"]
      interval: 5s
      retries: 10
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://servicecheck:${DB_PASSWORD:-servicecheck}@db:5432/servicecheck
      SECRET_KEY: "${SECRET_KEY:?SECRET_KEY muss gesetzt sein}"
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?ADMIN_PASSWORD muss gesetzt sein}"
      REPORT_COMPANY: "${REPORT_COMPANY:-PCO}"
      SEED_DEMO_DATA: "${SEED_DEMO_DATA:-0}"
    ports:
      - "8000:8000"
volumes:
  dbdata:
