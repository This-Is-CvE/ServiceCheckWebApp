services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: servicecheck
      POSTGRES_USER: servicecheck
      POSTGRES_PASSWORD: ${DB_PASSWORD:-servicecheck}
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U servicecheck"]
      interval: 5s
      retries: 10
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://servicecheck:${DB_PASSWORD:-servicecheck}@db:5432/servicecheck
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY setzen, z. B. mit: openssl rand -hex 32}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD setzen}
      REPORT_COMPANY: ${REPORT_COMPANY:-Managed Service Provider}
    ports:
      - "8000:8000"
volumes:
  dbdata:
